# Wildcard subdomain reverse proxy for CollegeVihar landing pages
# Place this config inside /etc/nginx/sites-available/ and symlink to sites-enabled.

# Redirect www and non-www main domain to the main site (exact match).
server {
    listen 80;
    listen [::]:80;
    server_name collegevihar.com www.collegevihar.com;

    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Wildcard catch-all for all subdomains.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name *.collegevihar.com;

    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Optional: HTTPS wildcard with Let's Encrypt (certbot --wildcard -d *.collegevihar.com).
